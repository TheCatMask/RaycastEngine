    function gameLoop() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        cycleCount++;
        if (cycleCount => 60) cycleCount = 0;
        var startTime = Date.now();
        var cycleTime = startTime - oldCycleTime;
        oldCycleTime = startTime;
        if (cycleCount % 60 == 0) fpsRate = Math.floor(fpsRate = 1000 / cycleTime);

        var mouseTileX = Math.floor(mousePosX / (MAP_SIZE / 3.25 * (2.13)));  // i have no idea why 3.25 is the golden number
        var mouseTileY = Math.floor(mousePosY / (MAP_SIZE / 3.25 * (2.12)));

        var indexOnMouse = 0;
        // needed for setting tiles: prevents setting them if mouse isn't on grid)
        if (mouseTileX > MAP_SIZE - 1 || mouseTileY > (MAP_SIZE) - 1) {
            indexOnMouse = null;
        } else {
            indexOnMouse = Math.floor(mouseTileX + (mouseTileY * MAP_SIZE));
        }

        map = datatoread;

        for (var row = 0; row < MAP_SIZE; row++) {
            for (var col = 0; col < MAP_SIZE; col++) {
                var square = row * MAP_SIZE + col;
                if (map[square] != 0) {
                    context.drawImage(WALLS[map[square]], 0, 0, 64, 64, Math.floor(mapOffsetX + col * (MAP_DEFAULT_ZOOM + zoom)), Math.floor(mapOffsetY + row * (MAP_DEFAULT_ZOOM + zoom)), (MAP_DEFAULT_ZOOM + zoom), (MAP_DEFAULT_ZOOM + zoom))
                } else {
                    context.fillStyle = '#000000'
                    context.fillRect(Math.floor(mapOffsetX + col * (MAP_DEFAULT_ZOOM + zoom)), Math.floor(mapOffsetY + row * (MAP_DEFAULT_ZOOM + zoom)), (MAP_DEFAULT_ZOOM + zoom), (MAP_DEFAULT_ZOOM + zoom)); // 3.8 instead of 4 for outlines
                }
            }
        }

        // set up selection menu
        context.drawImage(WALLS[setTile], 0, 0, 64, 64, (160 * zoom), (10 * zoom), 64 * zoom, 64 * zoom);

        context.fillStyle = 'Black';
        context.font = '32px Monospace';

        context.fillText(tiles[setTile].name, (160 * zoom), (82 * zoom));

        context.fillStyle = 'Black';
        context.font = '16px Monospace';

        context.fillText(tiles[setTile].description, (160 * zoom), (92 * zoom));


        if (mouseDown) {
            map[indexOnMouse] = setTile;
        }

        setTimeout(gameLoop, cycleDelay);



        // this renders fps to screen for debugging purposes
        context.fillStyle = 'Black';
        context.font = '64px Monospace';
        context.fillText('FPS: ' + fpsRate, (1 * zoom), (162 * zoom));

    } window.onload = function () { gameLoop(); };
