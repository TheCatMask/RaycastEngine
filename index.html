<style>
    html,
    body,
    canvas {
        margin: 0px;
        padding: 0px;
    }
</style>

<canvas id="screen" style="width: 100%; height: 100%" />

<script>
    // initializes the screen as the canvas
    const canvas = document.getElementById('screen');
    const context = canvas.getContext('2d');

    // counts FPS for debugging
    const FPS = 60;
    const cycleDelay = Math.floor(1000 / FPS);
    var oldCycleTime = 0;
    var cycleCount = 0;
    var fpsRate = 'calculating...';

    // screen constants
    const WIDTH = 320, HALF_WIDTH = 160;
    const HEIGHT = 200, HALF_HEIGHT = 100;


    var i = 0;
    // runs logic every tick
    function gameLoop() {
        // script for calcualting FPS
        cycleCount++;
        if (cycleCount => 60) cycleCount = 0;
        var startTime = Date.now();
        var cycleTime = startTime - oldCycleTime;
        oldCycleTime = startTime;
        if (cycleCount % 60 == 0) fpsRate = Math.floor(fpsRate = 1000 / cycleTime);

        // resizes the canvas
        canvas.width = window.innerWidth * 0.3;
        canvas.height = window.innerHeight * 0.3;

        //updates the screen every frame for smooth gameplay
        context.fillStyle = 'Black';
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = 'White';
        context.fillRect(canvas.width / 2 - HALF_WIDTH, canvas.height / 2 - HALF_HEIGHT, WIDTH, HEIGHT);
        if (i >= 32) i = 0
        i++;


        // sets gameLoop to run infinitely, delayed by cycleDelay so theres less stuttering
        setTimeout(gameLoop, cycleDelay);

        // this renders fps to screen
        context.fillStyle = 'White';
        context.font = '16px Monospace';
        context.fillText('FPS: ' + fpsRate, 0, 20);

    } window.onload = function () { gameLoop(); };

</script>
